<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imitation</title>

    <!-- ==================================================
         FUENTES
         ================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

    <style>
        /* ==================================================
           VARIABLES
           ================================================== */
        :root {
            --rojisima: #D61F3A;
            --bluetech: #4FA9C6;
            --dark: #111C20;
            --white: #E8E6E3;
        }

        /* ==================================================
           RESET
           ================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ==================================================
           BODY
           ================================================== */
        body {
            min-height: 100vh;
            background: var(--bluetech);
            color: var(--dark);
            font-family: "Saira", sans-serif;
            overflow: hidden;
        }

        /* ==================================================
           MENÚ PRINCIPAL
           ================================================== */
        .menu {
            width: 100%;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==================================================
           CONTENIDO CENTRAL
           ================================================== */
        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-30px);
        }

        /* ==================================================
           TÍTULO
           ================================================== */
        .title {
            font-family: "Clash Display", sans-serif;
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 600;
            letter-spacing: -0.045em;
            line-height: 0.9;
            color: var(--rojisima);
            text-align: center;
            user-select: none;
        }

        /* ==================================================
           ÁREA DE IMITACIÓN
           ================================================== */
        .imitation-area {
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: min(480px, 90vw);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .text-box {
            flex: 1;
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--dark);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            color: var(--dark);
            font-family: "Saira", sans-serif;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .text-box:focus {
            border-color: var(--rojisima);
            background: rgba(255, 255, 255, 0.25);
        }

        .text-box[readonly] {
            background: rgba(17, 28, 32, 0.12);
            cursor: default;
            opacity: 0.9;
        }

        .imitate-button {
            border: 2px solid var(--dark);
            background: var(--dark);
            color: var(--white);
            padding: 13px 28px;
            border-radius: 999px;
            font-family: "Saira", sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            cursor: pointer;
            white-space: nowrap;
            position: relative;
            transition:
                transform 0.15s ease,
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .imitate-button .hover-text {
            display: none;
        }

        .imitate-button:hover {
            background: var(--rojisima);
            border-color: var(--rojisima);
            color: var(--dark);          /* ← aquí el cambio a negro */
            transform: translateY(-2px);
}

        .imitate-button:hover .normal-text {
            display: none;
        }

        .imitate-button:hover .hover-text {
            display: inline;
        }

        .imitate-button:active {
            transform: translateY(1px);
        }

        /* ==================================================
           PROMOCIÓN ROJÍSIMA
           ================================================== */
        .promo {
            position: fixed;
            right: 34px;
            bottom: 28px;
            width: 300px;
            text-align: center;
            font-size: 0.78rem;
            line-height: 1.35;
        }

        .promo-title {
            color: var(--rojisima);
            font-family: "Clash Display", sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .promo-preorder {
            margin-top: 2px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .promo-soundtrack {
            margin-top: 10px;
            opacity: 0.75;
        }

        /* ==================================================
           REPRODUCTOR
           ================================================== */
        .audio-player {
            margin-top: 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
        }

        .audio-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .play-button {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border: 2px solid var(--dark);
            border-radius: 50%;
            background: transparent;
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-family: "Saira", sans-serif;
            font-size: 0.75rem;
            transition:
                background 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease;
        }

        .play-button:hover {
            background: var(--dark);
            color: var(--white);
            transform: scale(1.05);
        }

        .progress-container {
            width: 170px;
            height: 6px;
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .progress-background {
            width: 100%;
            height: 4px;
            background: rgba(17, 28, 32, 0.25);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--dark);
            border-radius: 999px;
            transition: width 0.05s linear;
        }

        .track-time {
            min-width: 76px;
            font-size: 0.68rem;
            font-variant-numeric: tabular-nums;
            opacity: 0.65;
            text-align: left;
        }

        .audio-secondary {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .audio-secondary button {
            border: 1px solid rgba(17, 28, 32, 0.65);
            background: transparent;
            color: var(--dark);
            padding: 4px 12px;
            border-radius: 999px;
            font-family: "Saira", sans-serif;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition:
                background 0.15s ease,
                color 0.15s ease,
                transform 0.15s ease;
        }

        .audio-secondary button:hover {
            background: var(--dark);
            color: var(--white);
            transform: translateY(-1px);
        }

        .audio-secondary button:active {
            transform: translateY(1px);
        }

        /* ==================================================
           RESPONSIVE
           ================================================== */
        @media (max-width: 700px) {
            .promo {
                right: 50%;
                transform: translateX(50%);
                bottom: 22px;
                width: 90vw;
                text-align: center;
            }

            .input-row {
                flex-direction: column;
            }

            .imitate-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="menu">
        <section class="center-content">
            <h1 class="title">IMITATION</h1>

            <div class="imitation-area">
                <div class="input-row">
                    <input
                        type="text"
                        class="text-box"
                        id="inputText"
                        placeholder="reklaW ardnaxelA"
                        autocomplete="off"
                    >
                    <button class="imitate-button" id="imitateButton">
                        <span class="normal-text">Imitar</span>
                        <span class="hover-text">ratimI</span>
                    </button>
                </div>

                <input
                    type="text"
                    class="text-box"
                    id="outputText"
                    placeholder="Alexandra Walker"
                    readonly
                >
            </div>
        </section>

        <aside class="promo">
            <div class="promo-title">
                Rojísima // REPRISE
            </div>

            <div class="promo-preorder">
                ¡Pre Ordena ahora!
            </div>

            <div class="promo-soundtrack">
                Escucha el soundtrack no oficial
            </div>

            <div class="audio-player">
                <div class="audio-main">
                    <button
                        class="play-button"
                        id="audioButton"
                        aria-label="Reproducir soundtrack"
                    >
                        ▶
                    </button>

                    <div
                        class="progress-container"
                        id="progressContainer"
                        aria-label="Progreso de la canción"
                    >
                        <div class="progress-background">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>

                    <span class="track-time" id="trackTime">
                        0:00 / 0:00
                    </span>
                </div>

                <div class="audio-secondary">
                    <button id="restartButton">RESTART</button>
                    <button id="stopButton">STOP</button>
                </div>
            </div>
        </aside>
    </main>

    <!-- ==================================================
         AUDIO
         ================================================== -->
    <audio id="repriseAudio" preload="auto">
        <source src="rojisima-reprise.mp3" type="audio/mpeg">
        Tu navegador no soporta audio HTML.
    </audio>

    <!-- ==================================================
         SCRIPT
         ================================================== -->
    <script>
        /* ==================================================
           IMITACIÓN (texto invertido)
           ================================================== */
        const inputText = document.getElementById("inputText");
        const outputText = document.getElementById("outputText");
        const imitateButton = document.getElementById("imitateButton");

        function imitate() {
            const original = inputText.value;
            const reversed = original.split("").reverse().join("");
            outputText.value = reversed;
        }

        imitateButton.addEventListener("click", imitate);

        // También permite Enter para imitar
        inputText.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                imitate();
            }
        });

        /* ==================================================
           AUDIO
           ================================================== */
        const audio = document.getElementById("repriseAudio");
        const audioButton = document.getElementById("audioButton");
        const progressContainer = document.getElementById("progressContainer");
        const progressFill = document.getElementById("progressFill");
        const trackTime = document.getElementById("trackTime");
        const restartButton = document.getElementById("restartButton");
        const stopButton = document.getElementById("stopButton");

        function formatTime(seconds) {
            if (!Number.isFinite(seconds)) return "0:00";
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, "0")}`;
        }

        function updateProgress() {
            if (!audio.duration) return;
            const percentage = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percentage}%`;
            trackTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }

        audioButton.addEventListener("click", (event) => {
            event.stopPropagation();
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        audioButton.textContent = "Ⅱ";
                        audioButton.setAttribute("aria-label", "Pausar soundtrack");
                    })
                    .catch(() => {
                        console.log("No se pudo reproducir el audio.");
                    });
            } else {
                audio.pause();
                audioButton.textContent = "▶";
                audioButton.setAttribute("aria-label", "Reproducir soundtrack");
            }
        });

        restartButton.addEventListener("click", (event) => {
            event.stopPropagation();
            audio.currentTime = 0;
            audio.play()
                .then(() => {
                    audioButton.textContent = "Ⅱ";
                    audioButton.setAttribute("aria-label", "Pausar soundtrack");
                    updateProgress();
                })
                .catch(() => {
                    audioButton.textContent = "▶";
                });
        });

        stopButton.addEventListener("click", (event) => {
            event.stopPropagation();
            audio.pause();
            audio.currentTime = 0;
            progressFill.style.width = "0%";
            audioButton.textContent = "▶";
            audioButton.setAttribute("aria-label", "Reproducir soundtrack");
            trackTime.textContent = `0:00 / ${formatTime(audio.duration)}`;
        });

        audio.addEventListener("timeupdate", updateProgress);
        audio.addEventListener("loadedmetadata", updateProgress);

        progressContainer.addEventListener("click", (event) => {
            event.stopPropagation();
            if (!audio.duration) return;
            const rectangle = progressContainer.getBoundingClientRect();
            const clickPosition = event.clientX - rectangle.left;
            const percentage = Math.max(0, Math.min(1, clickPosition / rectangle.width));
            audio.currentTime = audio.duration * percentage;
            updateProgress();
        });

        audio.addEventListener("ended", () => {
            audioButton.textContent = "▶";
            audioButton.setAttribute("aria-label", "Reproducir soundtrack");
            progressFill.style.width = "0%";
            trackTime.textContent = `0:00 / ${formatTime(audio.duration)}`;
        });
    </script>
</body>
</html>
